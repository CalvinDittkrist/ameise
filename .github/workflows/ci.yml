name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# The gate is `make check`, and its parts run here as parallel jobs, each on its own make targets, so a run
# waits on its longest part instead of their sum. The job `check` waits on all of them and is the one
# required status check (ADR 0008); a part added to `make check` gets a job here and a place in its needs.
# Every cache below only saves the minute of installation: a miss installs as before, and each key names
# the versions of what it holds, so a new version never reads an entry of an old one.
jobs:
  plugins:
    # The shell scripts, the plugins, the standard and the Python suite. The suite builds the release
    # binaries with the real scripts/factory-binaries.sh, so it needs Go and the dashboard's build too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm # npm's download cache, keyed by the lockfile; Claude Code still installs its latest
          cache-dependency-path: factory/ui/package-lock.json
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: '1.26' # factory/go.mod is written for 1.25; staticcheck 2026.2.1 needs 1.26 to build
          cache: false # its cache is keyed by go.sum, and the factory has no dependencies to have one
      # Content-addressed, so an entry restored from other sources is reused where it still matches and
      # ignored where it does not. Each job keeps its own, because each builds the factory differently.
      - name: Cache the Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('factory/go.mod', 'factory/**/*.go') }}
          restore-keys: go-build-${{ github.job }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Claude Code (for plugin validation)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install shellcheck 0.11.0 (same as brew, so local and CI findings match)
        run: |
          sudo apt-get install -y jq
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          sudo mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Gate
        run: make lint validate standard test

  factory:
    # The factory's Go service and the lint of the dashboard it embeds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: factory/ui/package-lock.json
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache staticcheck 2026.2.1
        id: staticcheck
        uses: actions/cache@v6
        with:
          path: ~/go/bin/staticcheck
          key: staticcheck-2026.2.1-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install staticcheck 2026.2.1 (same version as local, so local and CI findings match)
        if: steps.staticcheck.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      # The race detector's builds among them.
      - name: Cache the Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('factory/go.mod', 'factory/**/*.go') }}
          restore-keys: go-build-${{ github.job }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Gate
        run: make ui factory

  factory-browser:
    # The factory's dashboard in a real browser against the real binary in fake mode.
    runs-on: ubuntu-latest
    # Playwright's image carries the browser and the system libraries and fonts it needs. Installing them
    # on the runner fetched them from an Ubuntu mirror that at times took six minutes for 32 MB. The tag
    # is the Playwright version in factory/ui/package-lock.json (tested).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host # Chromium's shared memory, as Playwright's CI guide sets it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: factory/ui/package-lock.json
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: '1.26'
          cache: false
      - name: Cache the Go build
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ github.job }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('factory/go.mod', 'factory/**/*.go') }}
          restore-keys: go-build-${{ github.job }}-go${{ steps.go.outputs.go-version }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Install make, which the image leaves out
        run: apt-get update && apt-get install -y --no-install-recommends make
      - name: Install the dashboard's dependencies
        run: npm --prefix factory/ui ci
      - name: Gate
        run: make browser
      - name: Keep the browser test's report and what it saw when it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-factory
          path: |
            factory/ui/playwright-report
            factory/ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  local:
    # The local workflow: the controller and the dashboard it serves, read in a real browser.
    runs-on: ubuntu-latest
    # The same image as factory-browser, for the same reason. The tag is the Playwright version in
    # dashboard/package-lock.json (tested).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            controller/package-lock.json
            dashboard/package-lock.json
      - name: Install make, which the image leaves out
        run: apt-get update && apt-get install -y --no-install-recommends make
      - name: Install the dashboard's dependencies
        run: npm --prefix dashboard ci
      - name: Gate
        run: make controller dashboard
      - name: Keep the browser test's report and what it saw when it failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-dashboard
          path: |
            dashboard/playwright-report
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7

  check:
    # The one required status check. It runs whatever the parts did, because a check that is skipped
    # after a failed part would count as passed; it passes only when every part passed.
    if: always()
    needs: [plugins, factory, factory-browser, local]
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          [ -z "$failed" ] || { echo "error: the gate failed in $(tr '\n' ' ' <<<"$failed"); read that job's log" >&2; exit 1; }
