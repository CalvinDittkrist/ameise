name: controller-release
# The local workflow installs as one npm package: the controller, the dashboard it serves and the
# plugins its sessions load, at one version (ADR 0060). A controller version tag, and nothing else,
# publishes it: `scripts/release.sh controller --push` creates that tag from a green gate. No branch
# push and no other tag matches this trigger: a plugin release is tagged <plugin>--vX.Y.Z and a
# milestone vX.Y.Z, neither of which can carry a slash, and the factory's tags start with factory/.
on:
  push:
    tags: ['controller/v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    # Packing is the half that runs other people's code (npm packages, their install and build
    # scripts), so it does it with a token that can only read. Publishing is the other job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, so the tagged commit can be held against main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The tag and controller/package.json have to name the same version
        run: |
          tagged="${GITHUB_REF_NAME#controller/v}"
          said="$(node -p 'require("./controller/package.json").version')"
          [ "$tagged" = "$said" ] || {
            echo "error: the tag $GITHUB_REF_NAME was pushed, but controller/package.json says $said; tag with scripts/release.sh controller --push" >&2
            exit 1
          }
      - name: The tagged commit has to be on main
        # A tag can be pushed by hand from anywhere, and this package is never gated again: what
        # stands behind it is that the commit went through a pull request onto main.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "error: $GITHUB_SHA is not on main; a controller release is tagged on main (docs/repo-standard.md)" >&2
            exit 1
          }
      - name: The package, with the dashboard and the plugins inside it
        # The dashboard's build writes into controller/dist/dashboard. Packing builds the controller,
        # which bundles the plugins, and refuses a package that lacks either (controller/scripts).
        run: |
          npm --prefix dashboard ci
          npm --prefix dashboard run build
          npm --prefix controller ci
          mkdir -p "$RUNNER_TEMP/package"
          cd controller # npm pack packs the package of the directory it runs in, whatever --prefix says
          npm pack --pack-destination "$RUNNER_TEMP/package"
      - name: The installed package starts and serves the dashboard
        # Installed as a maintainer installs it, and started in fake mode, which needs no GitHub login
        # and no claude: what is checked is that the package carries what the program reads.
        run: |
          prefix="$RUNNER_TEMP/prefix"
          npm install --global --prefix "$prefix" "$RUNNER_TEMP"/package/workflows-controller-*.tgz
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" XDG_DATA_HOME="$RUNNER_TEMP/data" BROWSER=true
          "$prefix/bin/workflows" --fake > "$RUNNER_TEMP/workflows.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          page="$(curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:7420/)" || {
            cat "$RUNNER_TEMP/workflows.log" >&2
            echo "error: the installed workflows did not serve its dashboard" >&2
            exit 1
          }
          grep -q '<div id="root">' <<<"$page" || { echo "error: / is not the dashboard" >&2; exit 1; }
          installed="$prefix/lib/node_modules/workflows-controller/dist/plugins"
          for plugin in worker planner repo-standards; do
            [ -f "$installed/$plugin/.claude-plugin/plugin.json" ] || { echo "error: the package lacks the $plugin plugin" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: controller-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    # The only job that publishes, and all it runs is npm on the tarball the package job wrote: npm runs
    # no script of a package it publishes from a tarball. It alone gets an OIDC token, which signs the
    # provenance statement npm attaches to the published version.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: controller-package
          path: package
      - name: Publish it to npm
        # A version is published once: npm refuses a version the registry has, so a re-run of a
        # finished release fails there and a person releases the next version instead.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish package/workflows-controller-*.tgz --provenance --access public
